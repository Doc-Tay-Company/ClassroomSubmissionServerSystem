<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Classroom Submission Server · Xem trước UI</title>
<style>
:root{font:15px/1.55 Inter,system-ui,sans-serif;color:#172033;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}header,.bar,.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}header{background:white;border-bottom:1px solid #dce4ef;padding:14px max(20px,calc((100% - 1120px)/2))}nav{display:flex;gap:6px;flex-wrap:wrap}main{max-width:1160px;margin:auto;padding:28px 20px}h1{letter-spacing:-.035em;margin:8px 0;font-size:34px}h2{font-size:18px;margin:0 0 12px}p{margin:8px 0}small,.muted{color:#53647a}.panel,article{background:white;border:1px solid #dce4ef;border-radius:12px;padding:20px;min-width:0}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:20px}.work{display:grid;grid-template-columns:2fr 3fr;gap:14px;margin:14px 0}button,select{font:inherit;border:1px solid #d4dfec;border-radius:7px;background:white;color:#172033;padding:7px 12px}button{cursor:pointer;font-weight:600}button:disabled{cursor:default;opacity:.55}.primary,nav button[aria-current=page]{background:#215ac8;color:white;border-color:#215ac8}:focus-visible{outline:3px solid #4483ee;outline-offset:2px}.tag{display:inline-block;padding:3px 8px;border-radius:5px;background:#edf2f8;font-size:12px;font-weight:650}.green{background:#e4f4eb;color:#146239}.amber{background:#fff3d8;color:#754300}.blue{background:#e8f0ff;color:#214f9d}.notice{padding:12px;border-radius:8px;background:#edf4ff;margin-top:12px}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}td,th{text-align:left;padding:10px;border-bottom:1px solid #dce4ef}th{background:#f4f7fb;color:#42536a}pre,textarea{font:14px/1.6 Consolas,monospace;border-radius:8px;padding:14px;white-space:pre-wrap}pre{background:#f3f6fb}textarea{width:100%;min-height:255px;background:#172033;color:white;border:0;resize:vertical}.spaced{margin-top:14px}label{display:grid;gap:4px}dialog{width:min(540px,94vw);border:1px solid #dce4ef;border-radius:12px;padding:24px}dialog::backdrop{background:#17203366}@media(max-width:700px){.cards,.work{grid-template-columns:1fr}h1{font-size:27px}}
</style><header><strong>Classroom Submission Server</strong><nav aria-label="Màn hình xem trước"><button data-page="home">Bài thi</button><button data-page="practice">Luyện tập</button><button data-page="teacher">Teacher</button></nav></header>
<main id="screen"></main><dialog id="modal"></dialog>
<script>
const screen=document.querySelector('#screen'), modal=document.querySelector('#modal');
const initial='public class Main {\n    public static void main(String[] args) {\n        // Viết lời giải tại đây\n    }\n}';
const codes=[initial,initial];let question=0,ran=false,submitted=false,practiceMode='allow',practiceTimer,activePage='home',attempt='2';
const tag=(label,style='')=>'<span class="tag '+style+'">'+label+'</span>';
const button=(label,action,primary=false)=>'<button '+(primary?'class="primary" ':'')+'data-action="'+action+'">'+label+'</button>';
const table=(heads,rows)=>'<div class="scroll"><table><thead><tr>'+heads.map(x=>'<th scope="col">'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
const testcase=()=>table(['Test case','Kết quả','Điểm','Kỳ vọng','Thực tế','Lỗi'],[['Số chẵn',tag('Đạt','green'),'5/5','Chan','Chan','—'],['Số lẻ',tag('Đạt','green'),'5/5','Le','Le','—']]);
function render(page){clearTimeout(practiceTimer);activePage=page;document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.page===(['exam','result'].includes(page)?'home':page)?'page':'false'));
if(page==='home') screen.innerHTML='<div class="bar"><h1>Bài thi</h1><span class="muted">Nguyễn Minh Anh · SV24001</span></div><div class="cards">'+[
['Kiểm tra Java giữa kỳ',submitted?'Đã nộp':'Đang diễn ra',submitted?'green':'blue','Hôm nay · 09:00–10:30 · 90 phút',button(submitted?'Xem kết quả':'Vào làm bài',submitted?'result':'exam',true)],
['Kiểm tra cấu trúc dữ liệu','Sắp bắt đầu','amber','25/11 · 08:00–09:00 · 60 phút','<small>Mở lúc 08:00 ngày 25/11</small>'],
['Bài kiểm tra Java cơ bản','Đã kết thúc','','18/11 · 09:00–09:45 · 45 phút',button('Xem kết quả','result')]
].map(([title,state,color,time,action])=>'<article><div class="row"><strong>'+title+'</strong>'+tag(state,color)+'</div><p class="muted">'+time+'</p><div class="spaced">'+action+'</div></article>').join('')+'</div>';
if(page==='exam'){screen.innerHTML='<div class="bar"><h1>Kiểm tra Java giữa kỳ</h1><div class="row">'+tag('Còn 38:24','amber')+button('Nộp bài','confirm',true)+'</div></div><div class="row">'+[0,1].map(i=>button('Câu '+(i+1)+(codes[i]!==initial?' · Có mã':''),'q'+i,i===question)).join('')+'</div><div class="work"><section class="panel"><h2>Câu '+(question+1)+' · '+(question?'Tính tổng hai số':'Kiểm tra số chẵn lẻ')+'</h2><p>'+(question?'Đọc hai số nguyên và in tổng.':'Đọc số nguyên n. In Chan nếu n chẵn, hoặc Le nếu n lẻ.')+'</p><pre>'+(question?'Input: 2 3\nOutput: 5':'Input: 8\nOutput: Chan')+'</pre></section><section class="panel"><div class="row"><h2>Mã nguồn Java</h2><small>Main.java</small></div><textarea aria-label="Mã nguồn Java" spellcheck="false"></textarea><div class="row"><small>Bản nháp giữ trong phiên xem trước</small>'+button('Chạy thử','run',true)+'</div></section></div>'+(ran?'<section class="panel"><h2>Kết quả chạy thử mẫu</h2>'+testcase()+'</section>':'');const editor=screen.querySelector('textarea');editor.value=codes[question];editor.oninput=()=>{codes[question]=editor.value;ran=false;screen.querySelector('#run-preview')?.remove()};if(ran)screen.lastElementChild.id='run-preview';}
if(page==='result')screen.innerHTML=button('← Bài thi','home')+'<h1>Kết quả bài thi</h1><section class="panel"><div class="row"><strong>'+(submitted?'Kiểm tra Java giữa kỳ':'Bài kiểm tra Java cơ bản')+'</strong>'+tag('Đã chấm','green')+'</div><p><strong>10 / 10 điểm</strong></p><small>Đã nộp lúc 09:42 · Dữ liệu mẫu</small></section><section class="panel spaced"><h2>Điểm từng câu</h2><details><summary>Câu 1 · Kiểm tra số chẵn lẻ · 10/10</summary>'+testcase()+'</details></section>';
if(page==='practice'){screen.innerHTML='<div class="bar"><h1>Luyện tập</h1><label>Trạng thái mẫu<select id="practice-mode"><option value="allow">Được phép vào</option><option value="lock">Bị khóa</option><option value="error">Lỗi kết nối</option></select></label></div><section class="panel" id="practice-status" role="status" style="min-height:126px">Đang kiểm tra quyền truy cập…</section>';screen.querySelector('select').value=practiceMode;screen.querySelector('select').onchange=e=>{practiceMode=e.target.value;render('practice')};practiceTimer=setTimeout(()=>{if(activePage==='practice')document.querySelector('#practice-status').innerHTML=practiceMode==='allow'?'<h2>Thư viện luyện tập</h2><p>Kiểm tra số chẵn lẻ · Java</p>':practiceMode==='lock'?'<h2>Luyện tập đang bị khóa</h2><p>Bạn có thể quay lại sau khi kỳ thi kết thúc.</p>':'<h2>Chưa kiểm tra được quyền truy cập</h2>'+button('Thử lại','practice')},650);}
if(page==='teacher')screen.innerHTML='<h1>Kết quả code</h1><section class="panel"><div class="row"><label>Bài thi<select><option>Kiểm tra Java giữa kỳ</option></select></label><label>Sinh viên<select><option>Nguyễn Minh Anh · SV24001</option></select></label><label>Câu hỏi<select><option>Kiểm tra số chẵn lẻ</option></select></label></div><div class="spaced">'+table(['Sinh viên','MSSV','Câu 1','Tổng điểm'],[['Nguyễn Minh Anh','SV24001','10/10 '+button('Chi tiết','detail'),'10/10']])+'</div><div id="submission-detail"></div></section>';
}
function detail(){const score=attempt==='2'?'10/10':'5/10';const target=document.querySelector('#submission-detail');target.innerHTML='<div class="spaced bar"><h2>Nguyễn Minh Anh · Câu 1</h2>'+button('Đóng chi tiết','close-detail')+'</div><label>Lần nộp<select id="attempt"><option value="2">Lần 2 · 09:42</option><option value="1">Lần 1 · 09:34</option></select></label><p>Điểm <strong>'+score+'</strong></p><h2>Mã nguồn đã nộp</h2><pre></pre>'+(attempt==='2'?testcase():table(['Test case','Kết quả','Điểm','Kỳ vọng','Thực tế'],[['Số chẵn',tag('Đạt','green'),'5/5','Chan','Chan'],['Số lẻ',tag('Sai','amber'),'0/5','Le','Chan']]))+'<p class="notice">Có thể chấm lại sau khi bài thi kết thúc.</p>';target.querySelector('pre').textContent=attempt==='2'?'System.out.println(n % 2 == 0 ? "Chan" : "Le");':'System.out.println("Chan");';target.querySelector('select').value=attempt;target.querySelector('select').onchange=e=>{attempt=e.target.value;detail();target.querySelector('select').focus()};}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page)return render(b.dataset.page);const action=b.dataset.action;if(['home','exam','result','practice'].includes(action))render(action);if(action==='q0'||action==='q1'){question=Number(action[1]);ran=false;render('exam')}if(action==='run'){ran=true;render('exam')}if(action==='detail'){detail();document.querySelector('#attempt').focus()}if(action==='close-detail'){document.querySelector('#submission-detail').replaceChildren();screen.querySelector('[data-action=detail]').focus()}if(action==='confirm'){modal.innerHTML='<h2>Xác nhận nộp bài</h2><p>Còn '+codes.filter(code=>code===initial||!code.trim()).length+' câu chưa sửa mã khởi tạo.</p><div class="row">'+button('Quay lại','cancel')+button('Xác nhận nộp','submit',true)+'</div>';modal.showModal()}if(action==='cancel')modal.close();if(action==='submit'){modal.close();submitted=true;render('result')}});
render('home');
</script></html>
